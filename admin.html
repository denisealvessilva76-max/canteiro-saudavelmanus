<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Canteiro Saudável</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .login-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
            margin-bottom: 10px;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Dashboard Styles */
        .dashboard {
            display: none;
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .dashboard-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-title {
            font-size: 28px;
            font-weight: 600;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-email {
            font-size: 14px;
            opacity: 0.9;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .dashboard-content {
            padding: 30px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            padding: 12px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            font-weight: 500;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .form-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .form-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        .submit-btn {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background: #764ba2;
        }

        .list-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
        }

        .list-item {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-item-content {
            flex: 1;
        }

        .list-item-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .list-item-desc {
            font-size: 14px;
            color: #666;
        }

        .delete-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }

        .delete-btn:hover {
            background: #ff5252;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 30px;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Login Container -->
    <div class="login-container" id="loginContainer">
        <div class="login-header">
            <h1>🌿 Canteiro Saudável</h1>
            <p>Painel Administrativo</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Sua senha" required>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">Entrar</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Autenticando...</p>
        </div>
    </div>

    <!-- Dashboard Container -->
    <div class="dashboard" id="dashboard">
        <div class="dashboard-header">
            <div class="dashboard-title">📊 Dashboard Admin</div>
            <div class="user-info">
                <div class="user-email" id="userEmail"></div>
                <button class="logout-btn" id="logoutBtn">Sair</button>
            </div>
        </div>

        <div class="dashboard-content">
            <div class="tabs">
                <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
                <button class="tab-btn" data-tab="premios">Prêmios</button>
                <button class="tab-btn" data-tab="noticias">Notícias</button>
            </div>

            <!-- Dashboard Tab -->
            <div class="tab-content active" id="dashboardTab">
                <div class="success-message" id="successMessage"></div>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="totalFuncionarios">0</div>
                        <div class="stat-label">Total de Funcionários</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="ativosHoje">0</div>
                        <div class="stat-label">Ativos Hoje</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="hidratacaoMedia">0%</div>
                        <div class="stat-label">Hidratação Média</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="queixasTotal">0</div>
                        <div class="stat-label">Queixas Reportadas</div>
                    </div>
                </div>

                <div class="list-section">
                    <h3>Funcionários Cadastrados</h3>
                    <div id="funcionariosList"></div>
                </div>
            </div>

            <!-- Prêmios Tab -->
            <div class="tab-content" id="premiosTab">
                <div class="form-section">
                    <h3>Adicionar Novo Prêmio</h3>
                    <form id="premioForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="premioNome">Nome do Prêmio</label>
                                <input type="text" id="premioNome" placeholder="Ex: Camiseta Verde" required>
                            </div>
                            <div class="form-group">
                                <label for="premioPontos">Pontos Necessários</label>
                                <input type="number" id="premioPontos" placeholder="100" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="premioDesc">Descrição</label>
                            <textarea id="premioDesc" placeholder="Descrição do prêmio..." required></textarea>
                        </div>
                        <button type="submit" class="submit-btn">Adicionar Prêmio</button>
                    </form>
                </div>

                <div class="list-section">
                    <h3>Prêmios Disponíveis</h3>
                    <div id="premiosList"></div>
                </div>
            </div>

            <!-- Notícias Tab -->
            <div class="tab-content" id="noticiasTab">
                <div class="form-section">
                    <h3>Publicar Nova Notícia</h3>
                    <form id="noticiaForm">
                        <div class="form-group">
                            <label for="noticiaTitulo">Título</label>
                            <input type="text" id="noticiaTitulo" placeholder="Título da notícia..." required>
                        </div>
                        <div class="form-group">
                            <label for="noticiaConteudo">Conteúdo</label>
                            <textarea id="noticiaConteudo" placeholder="Conteúdo da notícia..." required></textarea>
                        </div>
                        <button type="submit" class="submit-btn">Publicar Notícia</button>
                    </form>
                </div>

                <div class="list-section">
                    <h3>Notícias Publicadas</h3>
                    <div id="noticiasList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyB32S5Eac0guxy1herefub70AIAGkgF1Rw",
            authDomain: "canteiro-saudavel.firebaseapp.com",
            databaseURL: "https://canteiro-saudavel-default-rtdb.firebaseio.com",
            projectId: "canteiro-saudavel",
            storageBucket: "canteiro-saudavel.firebasestorage.app",
            messagingSenderId: "37768857073",
            appId: "1:37768857073:web:3e62666713391869813050",
            measurementId: "G-1BZG7Q9NL4"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // DOM Elements
        const loginContainer = document.getElementById('loginContainer');
        const dashboard = document.getElementById('dashboard');
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const loading = document.getElementById('loading');
        const userEmail = document.getElementById('userEmail');
        const logoutBtn = document.getElementById('logoutBtn');
        const successMessage = document.getElementById('successMessage');

        // Login Handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            loading.style.display = 'block';
            errorMessage.style.display = 'none';

            try {
                await auth.signInWithEmailAndPassword(email, password);
                console.log('✅ Login realizado com sucesso!');
            } catch (error) {
                console.error('❌ Erro de login:', error);
                errorMessage.textContent = 'Email ou senha incorretos. Tente novamente.';
                errorMessage.style.display = 'block';
                loading.style.display = 'none';
            }
        });

        // Logout Handler
        logoutBtn.addEventListener('click', async () => {
            await auth.signOut();
        });

        // Auth State Listener
        auth.onAuthStateChanged((user) => {
            if (user) {
                console.log('✅ Usuário autenticado:', user.email);
                loginContainer.style.display = 'none';
                dashboard.style.display = 'block';
                userEmail.textContent = user.email;
                loading.style.display = 'none';
                loadDashboardData();
            } else {
                console.log('❌ Usuário não autenticado');
                loginContainer.style.display = 'flex';
                dashboard.style.display = 'none';
                loginForm.reset();
            }
        });

        // Tab Navigation
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tabName = btn.dataset.tab;
                
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                
                btn.classList.add('active');
                document.getElementById(tabName + 'Tab').classList.add('active');
            });
        });

        // Load Dashboard Data
        function loadDashboardData() {
            db.ref('usuarios').on('value', (snapshot) => {
                const usuarios = snapshot.val() || {};
                document.getElementById('totalFuncionarios').textContent = Object.keys(usuarios).length;
                
                let funcionariosList = document.getElementById('funcionariosList');
                funcionariosList.innerHTML = '';
                
                if (Object.keys(usuarios).length === 0) {
                    funcionariosList.innerHTML = '<div class="empty-message">Nenhum funcionário cadastrado ainda</div>';
                } else {
                    Object.values(usuarios).forEach(usuario => {
                        const item = document.createElement('div');
                        item.className = 'list-item';
                        item.innerHTML = `
                            <div class="list-item-content">
                                <div class="list-item-title">${usuario.nome || 'Sem nome'}</div>
                                <div class="list-item-desc">Matrícula: ${usuario.matricula || 'N/A'} | Turno: ${usuario.turno || 'N/A'}</div>
                            </div>
                        `;
                        funcionariosList.appendChild(item);
                    });
                }
            });

            // Load Prêmios
            db.ref('premios').on('value', (snapshot) => {
                const premios = snapshot.val() || {};
                let premiosList = document.getElementById('premiosList');
                premiosList.innerHTML = '';
                
                if (Object.keys(premios).length === 0) {
                    premiosList.innerHTML = '<div class="empty-message">Nenhum prêmio cadastrado</div>';
                } else {
                    Object.entries(premios).forEach(([key, premio]) => {
                        const item = document.createElement('div');
                        item.className = 'list-item';
                        item.innerHTML = `
                            <div class="list-item-content">
                                <div class="list-item-title">${premio.nome}</div>
                                <div class="list-item-desc">${premio.pontos} pontos | ${premio.descricao}</div>
                            </div>
                            <button class="delete-btn" onclick="deletePremio('${key}')">Deletar</button>
                        `;
                        premiosList.appendChild(item);
                    });
                }
            });

            // Load Notícias
            db.ref('noticias').on('value', (snapshot) => {
                const noticias = snapshot.val() || {};
                let noticiasList = document.getElementById('noticiasList');
                noticiasList.innerHTML = '';
                
                if (Object.keys(noticias).length === 0) {
                    noticiasList.innerHTML = '<div class="empty-message">Nenhuma notícia publicada</div>';
                } else {
                    Object.entries(noticias).forEach(([key, noticia]) => {
                        const item = document.createElement('div');
                        item.className = 'list-item';
                        item.innerHTML = `
                            <div class="list-item-content">
                                <div class="list-item-title">${noticia.titulo}</div>
                                <div class="list-item-desc">${noticia.conteudo}</div>
                            </div>
                            <button class="delete-btn" onclick="deleteNoticia('${key}')">Deletar</button>
                        `;
                        noticiasList.appendChild(item);
                    });
                }
            });
        }

        // Add Prêmio
        document.getElementById('premioForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const nome = document.getElementById('premioNome').value;
            const pontos = document.getElementById('premioPontos').value;
            const descricao = document.getElementById('premioDesc').value;

            const premioId = db.ref('premios').push().key;
            db.ref('premios/' + premioId).set({
                nome,
                pontos: parseInt(pontos),
                descricao
            });

            document.getElementById('premioForm').reset();
            showSuccess('Prêmio adicionado com sucesso!');
        });

        // Add Notícia
        document.getElementById('noticiaForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const titulo = document.getElementById('noticiaTitulo').value;
            const conteudo = document.getElementById('noticiaConteudo').value;

            const noticiaId = db.ref('noticias').push().key;
            db.ref('noticias/' + noticiaId).set({
                titulo,
                conteudo,
                data: new Date().toISOString()
            });

            document.getElementById('noticiaForm').reset();
            showSuccess('Notícia publicada com sucesso!');
        });

        // Delete Functions
        function deletePremio(id) {
            if (confirm('Tem certeza que deseja deletar este prêmio?')) {
                db.ref('premios/' + id).remove();
            }
        }

        function deleteNoticia(id) {
            if (confirm('Tem certeza que deseja deletar esta notícia?')) {
                db.ref('noticias/' + id).remove();
            }
        }

        // Show Success Message
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 3000);
        }

        console.log('✅ Admin.html carregado com Firebase Auth');
    </script>
</body>
</html>
