<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canteiro Saudável - Ferramentas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #14532d 0%, #15803d 50%, #16a34a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
        }
        h1 {
            font-size: 36px;
            color: #16a34a;
            margin-bottom: 10px;
        }
        p {
            color: #64748b;
            margin-bottom: 40px;
            font-size: 16px;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        a {
            display: block;
            padding: 16px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s;
            border: 2px solid;
        }
        .btn-primary {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border-color: #16a34a;
            box-shadow: 0 4px 12px rgba(22,163,74,0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(22,163,74,0.4);
        }
        .btn-secondary {
            background: white;
            color: #16a34a;
            border-color: #16a34a;
        }
        .btn-secondary:hover {
            background: #f0fdf4;
        }
        .info {
            margin-top: 40px;
            padding: 16px;
            background: #f0fdf4;
            border-radius: 8px;
            font-size: 13px;
            color: #15803d;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌱 Canteiro Saudável</h1>
        <p>Ferramentas Administrativas</p>
        
        <div class="buttons">
            <a href="painel-rtdb.html" class="btn-primary">📊 Painel Admin (Realtime Database)</a>
            <a href="health-check.html" class="btn-secondary">❤️ Health Check</a>
        </div>

        <div class="info">
            <strong>✅ Status:</strong> Realtime Database + Storage<br>
            <strong>🔄 Sincronização:</strong> Tempo real<br>
            <strong>📱 App:</strong> React Native + Expo
        </div>
    </div>
</body>
</html>
