<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canteiro Saudável - Painel Admin (Firestore)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0fdf4;
            color: #0f172a;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: linear-gradient(135deg, #14532d 0%, #15803d 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(21,128,61,0.3);
        }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .header p { opacity: 0.9; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #16a34a;
        }
        .stat-label { font-size: 12px; color: #64748b; text-transform: uppercase; margin-bottom: 8px; }
        .stat-value { font-size: 32px; font-weight: bold; color: #16a34a; }
        .employees-section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .employees-section h2 { margin-bottom: 20px; color: #0f172a; }
        .employee-item {
            padding: 16px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .employee-item:last-child { border-bottom: none; }
        .employee-name { font-weight: 600; color: #0f172a; }
        .employee-status { font-size: 12px; color: #64748b; margin-top: 4px; }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-active { background: #dcfce7; color: #15803d; }
        .status-inactive { background: #fee2e2; color: #dc2626; }
        .loading { text-align: center; padding: 40px; color: #64748b; }
        .error { background: #fee2e2; color: #dc2626; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌱 Canteiro Saudável</h1>
            <p>Painel Administrativo - Firestore Real-time</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total de Funcionários</div>
                <div class="stat-value" id="totalEmployees">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Ativos Hoje</div>
                <div class="stat-value" id="activeToday">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Hidratação Média</div>
                <div class="stat-value" id="hydrationAvg">0ml</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Queixas Semana</div>
                <div class="stat-value" id="complaintsWeek">0</div>
            </div>
        </div>

        <div class="employees-section">
            <h2>Funcionários Cadastrados</h2>
            <div id="employeesList" class="loading">Carregando dados do Firestore...</div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <script>
        // ========== CONFIGURAÇÃO DO FIREBASE ==========
        const firebaseConfig = {
            apiKey: "AIzaSyB32S5Eac0guxy1herefub70AIAGkgF1Rw",
            authDomain: "canteiro-saudavel.firebaseapp.com",
            projectId: "canteiro-saudavel",
            storageBucket: "canteiro-saudavel.firebasestorage.app",
            messagingSenderId: "37768857073",
            appId: "1:37768857073:web:3e62666713391869813050",
            measurementId: "G-1BZG7Q9NL4"
        };

        let db = null;
        let storage = null;

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            storage = firebase.storage();
            console.log('✅ Firebase Firestore inicializado com sucesso');
        } catch(e) {
            console.error('❌ Erro ao inicializar Firebase:', e);
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').textContent = 'Erro ao conectar com Firebase: ' + e.message;
        }

        // ========== FUNÇÕES DE DADOS ==========
        async function loadDashboardData() {
            if (!db) {
                console.error('Firebase não inicializado');
                return;
            }

            try {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const weekAgo = new Date();
                weekAgo.setDate(weekAgo.getDate() - 7);

                // Carregar usuários
                const usuariosSnap = await db.collection('usuarios').get();
                const totalEmployees = usuariosSnap.size;

                let activeToday = 0;
                let totalHydration = 0;
                let hydrationCount = 0;
                let complaintsWeek = 0;
                const employees = [];

                // Processar cada funcionário
                for (const doc of usuariosSnap.docs) {
                    const empData = doc.data();
                    const matricula = doc.id;

                    // Check-ins de hoje
                    const checkinsSnap = await db.collection('checkins')
                        .where('matricula', '==', matricula)
                        .where('criadoEm', '>=', new Date(today))
                        .get();

                    const hasCheckInToday = checkinsSnap.size > 0;
                    if (hasCheckInToday) activeToday++;

                    // Hidratação de hoje
                    const waterSnap = await db.collection('hidratacao')
                        .where('matricula', '==', matricula)
                        .where('criadoEm', '>=', new Date(today))
                        .get();

                    let hydrationToday = 0;
                    waterSnap.forEach(w => {
                        hydrationToday += w.data().agua || 0;
                    });

                    if (hydrationToday > 0) {
                        totalHydration += hydrationToday;
                        hydrationCount++;
                    }

                    // Queixas da semana
                    const symptomsSnap = await db.collection('saude')
                        .where('matricula', '==', matricula)
                        .where('tipo', '==', 'sintoma')
                        .where('criadoEm', '>=', new Date(weekAgo))
                        .get();

                    complaintsWeek += symptomsSnap.size;

                    employees.push({
                        id: matricula,
                        name: empData.nome || 'Sem nome',
                        matricula: matricula,
                        position: empData.funcao || '-',
                        turno: empData.turno || '-',
                        lastCheckIn: hasCheckInToday ? 'Hoje' : 'Não',
                        hydrationToday: hydrationToday,
                        hydrationGoal: 2000
                    });
                }

                // Atualizar UI
                document.getElementById('totalEmployees').textContent = totalEmployees;
                document.getElementById('activeToday').textContent = activeToday;
                document.getElementById('hydrationAvg').textContent = 
                    hydrationCount > 0 ? Math.round(totalHydration / hydrationCount) + 'ml' : '0ml';
                document.getElementById('complaintsWeek').textContent = complaintsWeek;

                // Renderizar lista de funcionários
                const employeesList = document.getElementById('employeesList');
                if (employees.length === 0) {
                    employeesList.innerHTML = '<p style="text-align: center; color: #64748b; padding: 20px;">Nenhum funcionário cadastrado ainda</p>';
                } else {
                    employeesList.innerHTML = employees.map(emp => `
                        <div class="employee-item">
                            <div>
                                <div class="employee-name">${emp.name}</div>
                                <div class="employee-status">
                                    Matrícula: ${emp.matricula} | Função: ${emp.position} | Turno: ${emp.turno}
                                </div>
                                <div class="employee-status" style="margin-top: 8px;">
                                    ✓ Check-in: ${emp.lastCheckIn} | 💧 Hidratação: ${emp.hydrationToday}/${emp.hydrationGoal}ml
                                </div>
                            </div>
                            <div>
                                <span class="status-badge ${emp.lastCheckIn === 'Hoje' ? 'status-active' : 'status-inactive'}">
                                    ${emp.lastCheckIn === 'Hoje' ? '🟢 Ativo' : '🔴 Inativo'}
                                </span>
                            </div>
                        </div>
                    `).join('');
                }

                console.log('✅ Dashboard atualizado com sucesso');
            } catch (error) {
                console.error('❌ Erro ao carregar dados:', error);
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Erro ao carregar dados: ' + error.message;
            }
        }

        // ========== INICIALIZAÇÃO ==========
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Iniciando painel admin...');
            loadDashboardData();
            // Atualizar a cada 10 segundos
            setInterval(loadDashboardData, 10000);
        });
    </script>
</body>
</html>
